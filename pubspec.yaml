name: urbania
description: "App para residentes de propiedades horizontales"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Router
  go_router: ^14.8.1

  # HTTP
  dio: ^5.8.0

  # Local DB
  drift: ^2.23.1
  drift_flutter: ^0.2.4
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Security
  flutter_secure_storage: ^9.2.4

  # Serialization
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Functional Programming
  fpdart: ^1.1.0

  # Demo
  faker: ^2.2.0

  # Utils
  connectivity_plus: ^6.1.4
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Code Generation
  build_runner: ^2.4.15
  freezed: ^2.5.8
  json_serializable: ^6.9.4
  riverpod_generator: ^2.6.4
  drift_dev: ^2.23.1
  mocktail: ^1.0.4

flutter:
  uses-material-design: true